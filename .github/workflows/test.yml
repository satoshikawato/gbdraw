name: Tests

permissions:
  contents: read
  actions: read

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  # Promotion accepts only the current remote dev tip, so older dev staging can be canceled.
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: CI impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.pr_plan.outputs.plan || steps.shadow_plan.outputs.plan }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test CI impact policy and adapters
        run: node --test tests/ci/*.test.mjs

      - name: Checkout trusted CI policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Build trusted PR CI impact plan
        if: github.event_name == 'pull_request'
        id: pr_plan
        env:
          CI_IMPACT_PROFILE: pr
          CI_IMPACT_EVENT_NAME: pull_request
          CI_IMPACT_REPOSITORY: ${{ github.repository }}
          CI_IMPACT_REPOSITORY_ROOT: ${{ github.workspace }}
          CI_IMPACT_CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_IMPACT_CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_IMPACT_WORKFLOW_SHA: ${{ github.sha }}
          CI_IMPACT_ARCHITECTURE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'architecture-change') && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .ci-trusted-base/tools/ci-impact.mjs plan

      - name: Build shadow dev CI impact plan
        if: github.event_name != 'pull_request'
        id: shadow_plan
        env:
          CI_IMPACT_PROFILE: dev
          CI_IMPACT_EVENT_NAME: ${{ github.event_name }}
          CI_IMPACT_REPOSITORY: ${{ github.repository }}
          CI_IMPACT_CHANGE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          CI_IMPACT_CHANGE_HEAD_SHA: ${{ github.sha }}
          CI_IMPACT_WORKFLOW_SHA: ${{ github.sha }}
          CI_IMPACT_ARCHITECTURE_CHANGE: 'false'
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-impact.mjs plan

  web-change-budget:
    name: Web change budget
    needs: ci-impact
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-change-budget')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Web change budget
        env:
          DEV_INTEGRATED_CHANGE: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          DEV_PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          DEV_PUSH_HEAD: ${{ github.event_name == 'push' && github.sha || '' }}
          WEB_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          WEB_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          WEB_ARCHITECTURE_CHANGE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'architecture-change') }}
        run: |
          if [[ "$DEV_INTEGRATED_CHANGE" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              BASE_SHA="$DEV_PUSH_BASE"
              HEAD_SHA="$DEV_PUSH_HEAD"
            else
              BASE_SHA="$(git rev-parse HEAD^1)"
              HEAD_SHA="$(git rev-parse HEAD)"
            fi
            node tools/check-web-change-budget.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node tools/check-web-change-budget.mjs
          fi

      - name: Check Web architecture contracts
        run: node --test tests/web/architecture-contracts.test.mjs

  core:
    name: Core (Python ${{ matrix.python-version }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout pytest-xdist Pillow

      - name: Run core tests
        run: >-
          python -m pytest tests/
          -m "not slow and not (recipe or gallery or browser)"
          -n auto --dist loadfile
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  core-pr:
    name: Core PR (Python 3.11)
    needs: ci-impact
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'core-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout pytest-xdist Pillow

      - name: Run core tests
        run: >-
          python -m pytest tests/
          -m "not slow and not (recipe or gallery or browser)"
          -n auto --dist loadfile
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  recipes-standard:
    name: Recipes standard (Python 3.11)
    needs: ci-impact
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'recipes-standard')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recipe test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run standard recipe tests
        run: >-
          python -m pytest tests/
          -m "recipe and not slow"
          --durations=30

  gallery:
    name: Gallery (Python 3.11)
    needs: ci-impact
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'gallery')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Gallery test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout Pillow

      - name: Run Gallery tests
        run: >-
          python -m pytest tests/
          -m "gallery and not slow"
          --durations=30

  browser:
    name: Browser (Python 3.11)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          python -m playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Web JavaScript tests
        run: |
          find tests/web -maxdepth 1 -type f \
            -name '*.test.mjs' ! -name 'architecture-contracts.test.mjs' \
            -print0 | xargs -0 node --test
          node --test --test-concurrency=1 tests/web/contracts/vibrio-sequence-source-coverage.test.mjs
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/hepatoplasmataceae_orthogroup.gbdraw-session.json.gz
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/tobacco-chloroplast.gbdraw-session.json

      - name: Run Python browser tests
        run: >-
          python -m pytest tests/
          -m "browser and not slow"
          --durations=30

      - name: Run offline GUI browser contracts
        run: >-
          python -m pytest tests/test_web_packaging.py
          -m "slow and browser"
          --durations=30

  web-pr-smoke:
    name: Web PR smoke
    needs: ci-impact
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-pr-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Web PR smoke dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run fast Web JavaScript contracts
        run: >-
          find tests/web -maxdepth 1 -type f
          -name '*.test.mjs' ! -name 'architecture-contracts.test.mjs'
          ! -name 'gallery-session-publication.test.mjs'
          -print0 | xargs -0 node --test

      - name: Run non-slow Python browser tests
        run: >-
          python -m pytest tests/
          -m "browser and not slow"
          --durations=30

      - name: Run Playwright PR smoke
        run: npm run test:web:pr-smoke

      - name: Upload Playwright PR smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-pr-smoke-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-functional:
    name: Playwright functional (shard ${{ matrix.shard }}/4)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright functional dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright functional tests
        run: npm run test:web:functional-full -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright functional traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-functional-shard-${{ matrix.shard }}-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-performance:
    name: Playwright performance
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright performance dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright performance tests
        run: npm run test:web:perf-smoke

      - name: Upload Playwright performance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  acceptance-supported-main:
    name: ${{ matrix.surface }} acceptance (Python ${{ matrix.python-version }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        surface: ["recipe", "gallery", "browser"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        if: matrix.surface == 'browser'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install browser runtime
        if: matrix.surface == 'browser'
        run: |
          npm ci
          python -m playwright install --with-deps chromium
          python tools/prepare_browser_wheel.py

      - name: Run supported-version acceptance
        run: >-
          python -m pytest tests/
          -m "${{ matrix.surface }} and not slow"
          --durations=30

  slow-main:
    name: Slow (Python ${{ matrix.python-version }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install slow test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run slow tests
        run: >-
          python -m pytest tests/
          -m "slow and not browser"
          --timeout=600
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  lint:
    name: Lint
    needs: ci-impact
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'lint')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install "ruff==0.15.12"

      - name: Check code formatting
        run: ruff check gbdraw/

  losat-cache-browser-acceptance:
    name: LOSAT cache browser acceptance
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build and browser dependencies
        run: |
          python -m pip install --upgrade build setuptools wheel
          python -m pip install -e .
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run LOSAT cache migration browser acceptance
        run: python tests/run_losat_cache_browser_acceptance.py

  pr-gate:
    name: PR / gate
    needs:
      - ci-impact
      - web-change-budget
      - core-pr
      - recipes-standard
      - gallery
      - lint
      - web-pr-smoke
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout trusted CI policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required PR evidence
        env:
          CI_IMPACT_PLAN_JSON: ${{ needs.ci-impact.outputs.plan }}
          CI_IMPACT_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMPACT_EXPECTED_PROFILE: pr
          CI_IMPACT_EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node .ci-trusted-base/tools/ci-impact.mjs gate

  dev-staging-gate:
    name: Dev staging / gate
    needs:
      - ci-impact
      - web-change-budget
      - core
      - recipes-standard
      - gallery
      - browser
      - playwright-functional
      - playwright-performance
      - acceptance-supported-main
      - slow-main
      - lint
      - losat-cache-browser-acceptance
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all exact-SHA staging evidence
        run: |
          set -euo pipefail
          test "${{ needs.ci-impact.result }}" = "success"
          test "${{ needs.web-change-budget.result }}" = "success"
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.recipes-standard.result }}" = "success"
          test "${{ needs.gallery.result }}" = "success"
          test "${{ needs.browser.result }}" = "success"
          test "${{ needs.playwright-functional.result }}" = "success"
          test "${{ needs.playwright-performance.result }}" = "success"
          test "${{ needs.acceptance-supported-main.result }}" = "success"
          test "${{ needs.slow-main.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.losat-cache-browser-acceptance.result }}" = "success"
