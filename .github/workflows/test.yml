name: Tests

permissions:
  contents: read

on:
  push:
    branches: ["main", "refactoring", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  core:
    name: Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout pytest-xdist Pillow

      - name: Run core tests
        run: >-
          python -m pytest tests/
          -m "not slow and not (recipe or gallery or browser)"
          -n auto --dist loadfile
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  recipes-standard:
    name: Recipes standard (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recipe fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Install recipe test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run standard recipe tests
        run: >-
          python -m pytest tests/
          -m "recipe and not recipe_heavy and not slow"
          --durations=30

  recipes-heavy:
    name: Recipes heavy ${{ matrix.scenario }} (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: ["T-PY-05", "T-PY-07"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recipe test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout Pillow

      - name: Run heavy recipe
        run: >-
          python -m pytest
          "tests/test_python_tutorial_recipe_contracts.py::test_python_tutorial_recipe_regenerates_from_a_clean_external_context[${{ matrix.scenario }}]"
          -m "recipe_heavy and not slow"
          --durations=30

  gallery:
    name: Gallery (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Gallery test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout Pillow

      - name: Run Gallery tests
        run: >-
          python -m pytest tests/
          -m "gallery and not slow"
          --durations=30

  browser:
    name: Browser (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          python -m playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Web JavaScript tests
        run: |
          node --test tests/web/*.test.mjs
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/hepatoplasmataceae_orthogroup.gbdraw-session.json.gz
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/tobacco-chloroplast.gbdraw-session.json
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/vibrio-harveyi-group-collinear.gbdraw-session.json.gz

      - name: Run Python browser tests
        run: >-
          python -m pytest tests/
          -m "browser and not slow"
          --durations=30

  acceptance-supported-main:
    name: ${{ matrix.surface }} acceptance (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        surface: ["recipe", "gallery", "browser"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        if: matrix.surface == 'browser'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install recipe fonts
        if: matrix.surface == 'recipe'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Install browser runtime
        if: matrix.surface == 'browser'
        run: |
          npm ci
          python -m playwright install --with-deps chromium
          python tools/prepare_browser_wheel.py

      - name: Run supported-version acceptance
        run: >-
          python -m pytest tests/
          -m "${{ matrix.surface }} and not slow"
          --durations=30

  slow-main:
    name: Slow (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install slow test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run slow tests
        run: >-
          python -m pytest tests/
          -m "slow"
          --timeout=600
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install "ruff==0.15.12"

      - name: Check code formatting
        run: ruff check gbdraw/

  losat-cache-browser-acceptance:
    name: LOSAT cache browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build and browser dependencies
        run: |
          python -m pip install --upgrade build setuptools wheel
          python -m pip install -e .
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run LOSAT cache migration browser acceptance
        run: python tests/run_losat_cache_browser_acceptance.py
