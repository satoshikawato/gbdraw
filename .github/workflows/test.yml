        if: steps.shard.outputs.files != ''
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright functional tests
        if: steps.shard.outputs.files != ''
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/functional-report.json
          FUNCTIONAL_SPECS: ${{ steps.shard.outputs.files }}
        # Each shard runs the spec files that tests/ci/functional-shards.json assigns
        # to it by measured duration; docs/internal/SELECTIVE_CI.md explains rebalancing.
        run: |
          files="$FUNCTIONAL_SPECS"
          npm run test:web:functional-full -- --reporter=line,github,json $files

