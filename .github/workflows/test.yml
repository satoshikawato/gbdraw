name: Tests

permissions:
  contents: read
  actions: read

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      tier:
        description: Integrated dev validation or exhaustive release/S11 acceptance
        type: choice
        options: [dev, release]
        default: dev
        required: true

concurrency:
  # A newer pull request run replaces the older one. A dev push run is never
  # canceled once started, so every started staging run leaves exact-SHA
  # evidence: the newest later push waits, and GitHub cancels older waiting runs.
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tier || 'dev' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci-impact:
    name: CI impact plan
    runs-on: ubuntu-latest
    # A full-history checkout with blobs took up to 5.7 minutes; history without
    # blobs costs about as much as a depth-1 checkout.
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.pr_plan.outputs.plan || steps.dev_plan.outputs.plan }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # All commits and trees; Git fetches old file contents on demand.
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked CI test dependencies
        run: npm ci

      - name: Test CI impact policy and adapters
        run: node --test tests/ci/*.test.mjs

      - name: Checkout trusted CI policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          sparse-checkout: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Build trusted PR CI impact plan
        if: github.event_name == 'pull_request'
        id: pr_plan
        env:
          CI_IMPACT_PROFILE: pr
          CI_IMPACT_EVENT_NAME: pull_request
          CI_IMPACT_REPOSITORY: ${{ github.repository }}
          CI_IMPACT_REPOSITORY_ROOT: ${{ github.workspace }}
          CI_IMPACT_CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_IMPACT_CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_IMPACT_WORKFLOW_SHA: ${{ github.sha }}
          CI_IMPACT_ARCHITECTURE_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'architecture-change') && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .ci-trusted-base/tools/ci-impact.mjs plan

      - name: Build dev CI impact plan
        if: github.event_name != 'pull_request'
        id: dev_plan
        env:
          CI_IMPACT_PROFILE: ${{ inputs.tier == 'release' && 'release' || 'dev' }}
          CI_IMPACT_EVENT_NAME: ${{ github.event_name }}
          CI_IMPACT_REPOSITORY: ${{ github.repository }}
          CI_IMPACT_CHANGE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          CI_IMPACT_CHANGE_HEAD_SHA: ${{ github.sha }}
          CI_IMPACT_WORKFLOW_SHA: ${{ github.sha }}
          CI_IMPACT_ARCHITECTURE_CHANGE: 'false'
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-impact.mjs plan

  web-change-budget:
    name: Web change budget
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-change-budget') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # All commits and trees; Git fetches old file contents on demand.
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Web change budget
        env:
          DEV_INTEGRATED_CHANGE: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          DEV_PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          DEV_PUSH_HEAD: ${{ github.event_name == 'push' && github.sha || '' }}
          WEB_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          WEB_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          WEB_ARCHITECTURE_CHANGE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'architecture-change') }}
        run: |
          if [[ "$DEV_INTEGRATED_CHANGE" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              BASE_SHA="$DEV_PUSH_BASE"
              HEAD_SHA="$DEV_PUSH_HEAD"
            else
              BASE_SHA="$(git rev-parse HEAD^1)"
              HEAD_SHA="$(git rev-parse HEAD)"
            fi
            node tools/check-web-change-budget.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node tools/check-web-change-budget.mjs
          fi

      - name: Check Web architecture contracts
        run: node --test tests/web/architecture-contracts.test.mjs

  core:
    name: Core (Python ${{ matrix.python-version }})
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'core') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout pytest-xdist Pillow

      - name: Run core tests
        run: >-
          python -m pytest tests/
          -m "not slow and not (recipe or gallery or browser)"
          -n auto --dist loadfile
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  core-pr:
    name: Core PR (Python 3.11)
    needs: ci-impact
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'core-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout pytest-xdist Pillow

      - name: Run core tests
        run: >-
          python -m pytest tests/
          -m "not slow and not (recipe or gallery or browser)"
          -n auto --dist loadfile
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  recipes-standard:
    name: Recipes standard (Python 3.11)
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'recipes-standard') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install recipe test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run standard recipe tests
        run: >-
          python -m pytest tests/
          -m "recipe and not slow"
          --durations=30

  gallery:
    name: Gallery (Python 3.11)
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'gallery') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    # Leaves room for a slow apt mirror on a cache miss; test steps keep their own limits.
    timeout-minutes: 25
    env:
      GBDRAW_GALLERY_PR_PARITY: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-pr-smoke') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Gallery test dependencies
        run: python -m pip install -e ".[export]" pytest pytest-timeout Pillow

      - name: Run Gallery tests
        timeout-minutes: 10
        run: >-
          python -m pytest tests/
          -m "gallery and not slow"
          --durations=30

      - name: Set up Node.js for Gallery parity
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Gallery parity dependencies
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        run: |
          python -m pip install build
          npm ci

      - name: Restore Playwright system packages
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          npx playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare Gallery browser wheel
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        run: python tools/prepare_browser_wheel.py

      - name: Verify Gallery first-Generate parity
        if: env.GBDRAW_GALLERY_PR_PARITY == 'true'
        timeout-minutes: 10
        run: npm run test:web:gallery-publication

      - name: Upload Gallery parity traces
        if: failure() && env.GBDRAW_GALLERY_PR_PARITY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-parity-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser (Python 3.11)
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'browser') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    # Leaves room for a slow apt mirror on a cache miss; test steps keep their own limits.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          python -m playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Web JavaScript tests
        timeout-minutes: 5
        run: |
          find tests/web -maxdepth 1 -type f \
            -name '*.test.mjs' ! -name 'architecture-contracts.test.mjs' \
            -print0 | xargs -0 node --test
          node --test --test-concurrency=1 tests/web/contracts/vibrio-sequence-source-coverage.test.mjs
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/hepatoplasmataceae_orthogroup.gbdraw-session.json.gz
          node tests/web/session-request.test.mjs --project-session gbdraw/web/gallery/sessions/tobacco-chloroplast.gbdraw-session.json

      - name: Run Python browser tests
        timeout-minutes: 10
        run: >-
          python -m pytest tests/
          -m "browser and not slow"
          --durations=30

      - name: Run package build integration
        timeout-minutes: 5
        run: >-
          python -m pytest tests/test_web_packaging.py
          -m "slow and not browser"
          --durations=30

      - name: Run offline GUI browser contracts
        timeout-minutes: 5
        run: >-
          python -m pytest tests/test_web_packaging.py
          -m "slow and browser"
          --durations=30

  web-contracts-pr:
    name: Web contracts (Python 3.11)
    needs: ci-impact
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      (contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-contracts-pr') ||
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-pr-smoke'))
    runs-on: ubuntu-latest
    # Leaves room for a slow apt mirror on a cache miss; test steps keep their own limits.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Web contract dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          python -m playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run fast Web JavaScript contracts
        timeout-minutes: 5
        run: >-
          find tests/web -maxdepth 1 -type f
          -name '*.test.mjs' ! -name 'architecture-contracts.test.mjs'
          ! -name 'gallery-session-publication.test.mjs'
          -print0 | xargs -0 node --test

      - name: Run non-slow Python browser tests
        timeout-minutes: 10
        run: >-
          python -m pytest tests/
          -m "browser and not slow"
          --durations=30

  web-pr-smoke:
    name: Web PR smoke
    needs: ci-impact
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'dev' &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'web-pr-smoke')
    runs-on: ubuntu-latest
    # Leaves room for a slow apt mirror on a cache miss; test steps keep their own limits.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Web PR smoke dependencies
        run: |
          python -m pip install -e . build
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          npx playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright PR smoke
        timeout-minutes: 10
        run: npm run test:web:pr-smoke

      - name: Upload Playwright PR smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-pr-smoke-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-functional:
    name: Playwright functional (shard ${{ matrix.shard }}/8)
    needs: ci-impact
    # Runs on a pull request only when the trusted base plan selects it.
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'playwright-functional') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright functional dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          npx playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright functional tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/functional-report.json
          # Playwright splits shards by case count in file order. These per-shard
          # case counts (505 cases) give each shard about 12 minutes of measured
          # work (runs 36965859931, 36957033319); equal counts gave 5-20 minutes.
          PWTEST_SHARD_WEIGHTS: "54:33:78:83:56:46:75:80"
        run: npm run test:web:functional-full -- --shard=${{ matrix.shard }}/8 --reporter=line,github,json

      - name: Upload Playwright functional traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-functional-shard-${{ matrix.shard }}-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-performance:
    name: Playwright performance
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'playwright-performance') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    # Leaves room for a slow apt mirror on a cache miss; test steps keep their own limits.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright performance dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          npx playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run Playwright performance tests
        timeout-minutes: 10
        run: npm run test:web:perf-smoke

      - name: Upload Playwright performance traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-performance-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  acceptance-supported-main:
    name: ${{ matrix.surface }} acceptance (Python ${{ matrix.python-version }})
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'acceptance-supported-main') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        surface: ["recipe", "gallery", "browser"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        if: matrix.surface == 'browser'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install acceptance dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install browser runtime
        if: matrix.surface == 'browser'
        run: |
          npm ci
          python tools/prepare_browser_wheel.py

      - name: Restore Playwright system packages
        if: matrix.surface == 'browser'
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        if: matrix.surface == 'browser'
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          python -m playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Run supported-version acceptance
        run: >-
          python -m pytest tests/
          -m "${{ matrix.surface }} and not slow"
          --durations=30

  slow-main:
    name: Slow (Python ${{ matrix.python-version }})
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'slow-main') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install slow test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run slow tests
        run: >-
          python -m pytest tests/
          -m "slow and not browser"
          --timeout=600
          --durations=30

      - name: Verify reference outputs are unchanged
        if: always()
        run: git diff --exit-code -- tests/reference_outputs/

  lint:
    name: Lint
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'lint') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install "ruff==0.15.12"

      - name: Check code formatting
        run: ruff check gbdraw/

  losat-cache-browser-acceptance:
    name: LOSAT cache browser acceptance
    needs: ci-impact
    if: >-
      !cancelled() &&
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'losat-cache-browser-acceptance') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build and browser dependencies
        run: |
          python -m pip install --upgrade build setuptools wheel
          python -m pip install -e .
          npm ci

      - name: Restore Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: playwright-apt-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium and system packages
        id: playwright-install
        run: |
          # Seed apt with cached .deb files; apt checks each against the signed index.
          sudo cp -t /var/cache/apt/archives/ ~/.cache/playwright-apt/*.deb 2>/dev/null || true
          npx playwright install --with-deps chromium
          # Keep the .deb files apt can still download; key the cache by their content.
          sudo apt-get autoclean -qq || true
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          if cp -t ~/.cache/playwright-apt/ /var/cache/apt/archives/*.deb 2>/dev/null; then
            sum="$(cd ~/.cache/playwright-apt && sha256sum -- *.deb | LC_ALL=C sort | sha256sum | cut -c1-16)"
            echo "apt-cache-key=playwright-apt-v1-${RUNNER_OS}-${RUNNER_ARCH}-${sum}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright system packages
        if: >-
          steps.playwright-install.outputs.apt-cache-key != '' &&
          steps.playwright-install.outputs.apt-cache-key != steps.playwright-apt.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-install.outputs.apt-cache-key }}

      - name: Prepare browser wheel
        run: python tools/prepare_browser_wheel.py

      - name: Run LOSAT cache migration browser acceptance
        run: python tests/run_losat_cache_browser_acceptance.py

  pr-gate:
    name: PR / gate
    needs:
      - ci-impact
      - web-change-budget
      - core-pr
      - recipes-standard
      - gallery
      - lint
      - web-contracts-pr
      - web-pr-smoke
      - playwright-functional
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout trusted CI policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-trusted-base
          sparse-checkout: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required PR evidence
        env:
          CI_IMPACT_PLAN_JSON: ${{ needs.ci-impact.outputs.plan }}
          CI_IMPACT_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMPACT_EXPECTED_PROFILE: pr
          CI_IMPACT_EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node .ci-trusted-base/tools/ci-impact.mjs gate

  dev-staging-gate:
    name: Dev staging / gate
    needs:
      - ci-impact
      - web-change-budget
      - core
      - recipes-standard
      - gallery
      - browser
      - playwright-functional
      - playwright-performance
      - acceptance-supported-main
      - slow-main
      - lint
      - losat-cache-browser-acceptance
    if: >-
      always() && inputs.tier != 'release' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout protected dev CI policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required dev staging evidence
        env:
          CI_IMPACT_PLAN_JSON: ${{ needs.ci-impact.outputs.plan }}
          CI_IMPACT_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMPACT_EXPECTED_PROFILE: dev
          CI_IMPACT_EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node tools/ci-impact.mjs gate

  release-gate:
    name: Release / gate
    needs:
      - ci-impact
      - web-change-budget
      - core
      - recipes-standard
      - gallery
      - browser
      - playwright-functional
      - playwright-performance
      - acceptance-supported-main
      - slow-main
      - lint
      - losat-cache-browser-acceptance
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/dev' && inputs.tier == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected dev CI policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exhaustive release evidence
        env:
          CI_IMPACT_PLAN_JSON: ${{ needs.ci-impact.outputs.plan }}
          CI_IMPACT_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMPACT_EXPECTED_PROFILE: release
          CI_IMPACT_EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node tools/ci-impact.mjs gate

      - name: Require exact candidate Gallery readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/check-promotion-readiness.mjs workflow-evidence
          --repository "$GITHUB_REPOSITORY"
          --workflow-path .github/workflows/gallery-publication.yml
          --aggregate-name "Gallery readiness / gate"
          --head-sha "${{ github.sha }}"
