name: Public LOSAT distribution acceptance

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to verify
        type: choice
        default: all
        options: [all, macos]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.targets.outputs.include }}
    steps:
      - id: targets
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python - <<'PYTHON'
          import json, os
          rows = [
              dict(id="linux-x64", runner="ubuntu-24.04", architecture="x64", execution_mode="native"),
              dict(id="windows-x64", runner="windows-2025", architecture="x64", execution_mode="native"),
              dict(id="macos-arm64", runner="macos-15", architecture="arm64", execution_mode="native"),
              dict(id="macos-x64", runner="macos-15-intel", architecture="x64", execution_mode="native"),
              dict(id="macos-rosetta", runner="macos-15", architecture="x64", execution_mode="rosetta"),
          ]
          if os.environ["PLATFORMS"] == "macos":
              rows = [row for row in rows if row["id"].startswith("macos-")]
          for row in rows:
              row["python"] = "/usr/bin/arch -x86_64 python" if row["execution_mode"] == "rosetta" else "python"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("include=" + json.dumps(rows) + "\n")
          PYTHON
  native-install:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Read the verified public release pin
        id: pin
        run: |
          ${{ matrix.python }} - <<'PY'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('gbdraw/data/losat-release.json').read_text())
          sha = lock['candidate_sha']
          if not isinstance(sha, str) or not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Public release pin is required before acceptance')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'candidate_sha={sha}\n')
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: satoshikawato/LOSAT
          ref: ${{ steps.pin.outputs.candidate_sha }}
          path: losat-source
      - name: Build and install the Python wheel
        run: |
          ${{ matrix.python }} -m pip install build
          ${{ matrix.python }} -m build --wheel --outdir "$RUNNER_TEMP/gbdraw-dist"
          ${{ matrix.python }} -m pip install "$RUNNER_TEMP"/gbdraw-dist/*.whl
      - name: Download the public binary and verify offline use
        working-directory: ${{ runner.temp }}
        run: |
          ${{ matrix.python }} "$GITHUB_WORKSPACE/tools/verify_losat_installation.py" \
            --losat-source "$GITHUB_WORKSPACE/losat-source" \
            --execution-mode "${{ matrix.execution_mode }}" \
            --output "$RUNNER_TEMP/losat-acceptance/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: losat-installation-${{ matrix.id }}
          path: ${{ runner.temp }}/losat-acceptance
          if-no-files-found: warn
          retention-days: 30
