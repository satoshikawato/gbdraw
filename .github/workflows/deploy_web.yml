name: Verify hosted Web app

on:
  push:
    branches: ["main"]
  # Once a day the hosted-site check alone runs against main's head. A schedule runs
  # the copy of this file on the default branch, main, with github.sha at its head.
  schedule:
    - cron: "17 21 * * *"
  # A dispatch with site_sha runs only the hosted-site check against that main commit;
  # a dispatch without it runs only the Gallery verification.
  workflow_dispatch:
    inputs:
      site_sha:
        description: "Main commit to check on the hosted site (runs only that check)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: "hosted-web-verification"
  cancel-in-progress: false

jobs:
  gallery-publication-browser:
    name: Gallery publication browser (exact main SHA)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.site_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Gallery browser dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium
          python tools/prepare_browser_wheel.py
      - name: Install the managed LOSAT runtime
        uses: ./.github/actions/managed-losat
      - name: Run all public Gallery parity owners
        run: |
          npm run test:web:gallery-publication
          npm run test:web:vibrio-generate

      - name: Verify reviewed Gallery artifacts
        run: |
          node --test tests/web/gallery-session-publication.test.mjs
          python -m pytest tests/test_gallery_session_semantics.py tests/test_refresh_gallery_sessions.py -q
          python tools/gallery_artifact_manifest.py

  # Reports whether the production Worker serves the Cloudflare build of this commit and
  # starts (docs/internal/WEB_PERIODIC_AUDIT.md, "Hosted site check and rollback").
  # Cloudflare challenges GitHub runners on gbdraw.app (HTTP 403, cf-mitigated:
  # challenge), so the job reads the same production Worker at its workers.dev address.
  hosted-site:
    name: Hosted site serves this main commit
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.site_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Chromium for the startup check
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the hosted site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_SHA: ${{ inputs.site_sha || github.sha }}
        run: node tools/check-hosted-site.mjs --sha "$SITE_SHA" --url https://gbdraw.genome-kawato.workers.dev/
