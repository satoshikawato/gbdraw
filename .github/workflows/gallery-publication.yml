name: Gallery publication

permissions:
  contents: read
  actions: read

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      complete_refresh:
        description: Run the three-trial baseline/head complete-refresh gate
        required: false
        default: false
        type: boolean

concurrency:
  group: gallery-publication-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: CI impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Gallery CI impact plan
        id: plan
        env:
          CI_IMPACT_PROFILE: gallery
          CI_IMPACT_EVENT_NAME: ${{ github.event_name }}
          CI_IMPACT_REPOSITORY: ${{ github.repository }}
          CI_IMPACT_CHANGE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          CI_IMPACT_CHANGE_HEAD_SHA: ${{ github.sha }}
          CI_IMPACT_WORKFLOW_SHA: ${{ github.sha }}
          CI_IMPACT_ARCHITECTURE_CHANGE: 'false'
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-impact.mjs plan

  browser:
    name: Gallery browser (common 9)
    needs: ci-impact
    if: >-
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact test SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install browser dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium
          python tools/prepare_browser_wheel.py
      - name: Verify first-Generate parity
        run: npm run test:web:gallery-publication

  performance:
    name: Gallery publication performance (projection)
    needs: ci-impact
    if: >-
      needs.ci-impact.result == 'success' &&
      contains(fromJSON(needs.ci-impact.outputs.plan).requiredJobs, 'performance')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact test SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install performance dependencies
        run: python -m pip install -e ".[export]" Pillow
      - name: Enforce three-trial projection gate
        run: >-
          python tools/measure_gallery_publication_performance.py projection
          --baseline-revision 574b33b83962949397839e2aaa862a8b96667625
          --revision ${{ github.sha }}
      - name: Enforce three-trial complete-refresh gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.complete_refresh }}
        run: >-
          python tools/measure_gallery_publication_performance.py refresh
          --baseline-revision 574b33b83962949397839e2aaa862a8b96667625
          --revision ${{ github.sha }}

  readiness-gate:
    name: Gallery readiness / gate
    needs:
      - ci-impact
      - browser
      - performance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout protected dev CI policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required Gallery readiness evidence
        env:
          CI_IMPACT_PLAN_JSON: ${{ needs.ci-impact.outputs.plan }}
          CI_IMPACT_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_IMPACT_EXPECTED_PROFILE: gallery
          CI_IMPACT_EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node tools/ci-impact.mjs gate
